name: Actualizar datos

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días, 6:00 am hora del centro de México
  workflow_dispatch: {}     # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar ClickUp y Slack
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: python scripts/fetch_data.py
      - name: Guardar data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar datos $(date -u +%Y-%m-%d)"
            git push
          fi
